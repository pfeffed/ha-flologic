[project]
name = "ha-flologic-dev"
version = "0.0.0"
description = "Development environment for the FloLogic Home Assistant integration"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant>=2025.1",
  "pytest-homeassistant-custom-component",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

# No pyflologic dependency on purpose. The library is vendored into
# custom_components/flologic/vendor/, and leaving it out of the environment
# means any code still reaching for an installed copy fails immediately
# rather than passing here and breaking on a real Home Assistant.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
# The vendored copy is upstream code, checked by its own repository and
# required to stay byte-identical so drift is detectable.
extend-exclude = ["custom_components/flologic/vendor"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "C4", "E", "F", "I", "ISC", "N",
  "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "SIM", "SLF",
  "T20", "TID", "TRY", "UP", "W",
]
ignore = [
  "ANN401",  # Any is legitimate at the raw-payload boundary
  "TRY003",  # short inline exception messages are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004", "SLF001", "S101", "ARG"]
"scripts/*" = ["T201"]  # a release script reports what it did

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
